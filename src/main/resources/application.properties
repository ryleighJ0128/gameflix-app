spring.application.name=module4-jwt-service
# This optional file is local to the project directory and is excluded from Git.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# schema.sql is documentation; Hibernate maintains the assignment schema.
spring.sql.init.mode=never

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=module4-jwt-service
app.jwt.audience=module4-api
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# SQL exception text and bind values can contain hashes or request data.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
