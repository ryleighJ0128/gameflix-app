name: GameFlix Spring Boot and Docker CI
on:
  push:
    branches: [main, module5-docker-ci]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      testmysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: module4_jwt_test
          MYSQL_ROOT_PASSWORD: isolated_ci_root_only
          MYSQL_USER: ci_app
          MYSQL_PASSWORD: isolated_ci_app_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/module4_jwt_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ci_app
      DB_PASSWORD: isolated_ci_app_only
      COMPOSE_PROJECT_NAME: gameflix_module5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package Spring Boot with real MySQL
        run: |
          mkdir -p module5-evidence
          mvn --batch-mode --no-transfer-progress clean verify | tee module5-evidence/maven.txt
      - name: Configure and validate Docker Compose
        run: |
          python3 scripts/configure-compose.py
          docker compose version
          docker compose config --quiet
      - name: Build and start Spring Boot and MySQL containers
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Verify API database writes and persistence
        run: python3 -u scripts/verify-compose.py | tee module5-evidence/compose-verification.txt
      - name: Capture service status and logs
        if: always()
        run: |
          mkdir -p module5-evidence
          if [ -f .env ]; then
            docker compose ps > module5-evidence/containers.txt
            docker compose logs --no-color app > module5-evidence/application.txt
          fi
          printf 'Commit %s\nRun https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > module5-evidence/run.txt
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gameflix-module5-evidence
          path: module5-evidence/
          retention-days: 14
      - name: Clean up disposable CI containers and database
        if: always()
        run: |
          if [ -f .env ]; then docker compose down --volumes; fi
